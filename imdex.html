<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Robot – Kamera + Ovozli javob</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000; color: #fff; width: 100vw; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow-x: hidden; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 12px;
        }
        .container {
            width: 100%; max-width: 700px; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .robot-face-wrapper {
            position: relative; width: 100%; max-width: 650px; aspect-ratio: 4/3;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #16161a 0%, #000 85%);
            border-radius: 50px; padding: 20px;
            border: 2px solid rgba(255,255,255,0.08); box-shadow: 0 0 70px rgba(255,255,255,0.05);
        }
        .camera-circle {
            position: absolute; top: 10px; right: 15px;
            width: 80px; height: 80px; border-radius: 50%; overflow: hidden;
            border: 3px solid rgba(255,255,255,0.4); box-shadow: 0 0 30px rgba(0,200,255,0.3);
            z-index: 10; background: #222;
        }
        .camera-circle video {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        .eyes-container {
            display: flex; justify-content: space-between; align-items: center;
            width: 70%; max-width: 360px; margin-bottom: 4vh;
        }
        .eye {
            width: 40%; aspect-ratio: 1/1; max-width: 120px;
            background: #fff; border-radius: 50%;
            box-shadow: 0 0 40px rgba(255,255,255,0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .eye.closed { transform: scaleY(0.1) scaleX(0.9); border-radius: 20px; }
        .mouth-container {
            display: flex; justify-content: center; align-items: center;
            width: 50%; max-width: 180px; height: 60px;
        }
        .mouth {
            width: 80%; max-width: 120px; height: 18px;
            background: #fff; border-radius: 30px;
            box-shadow: 0 0 30px rgba(255,255,255,0.7);
            transition: all 0.2s ease;
        }
        .robot-face-wrapper.listening .eye { transform: scale(0.85) translateY(10px); border-radius: 40%; }
        .robot-face-wrapper.listening .mouth { width: 50%; height: 10px; border-radius: 12px; }
        .robot-face-wrapper.thinking .eye { transform: scaleY(0.3) scaleX(0.85); border-radius: 20px; }
        .robot-face-wrapper.thinking .mouth { width: 55%; height: 6px; border-radius: 4px; transform: translateY(12px) rotate(-4deg); }
        .robot-face-wrapper.speaking .eye { transform: scale(1.05); }
        .robot-face-wrapper.speaking .mouth { width: 65%; height: 40px; border-radius: 50px; animation: talkAnim 0.15s infinite alternate; }
        @keyframes talkAnim { 0% { height: 18px; border-radius: 30px; } 100% { height: 50px; border-radius: 50px; } }
        .robot-face-wrapper.happy .eye { transform: scale(0.9) translateY(-6px); border-radius: 40% 40% 50% 50%; }
        .robot-face-wrapper.happy .mouth { width: 45%; height: 28px; border-radius: 0 0 50px 50px; transform: translateY(-4px); }
        .robot-face-wrapper.surprised .eye { transform: scale(1.15); }
        .robot-face-wrapper.surprised .mouth { width: 30%; height: 35px; border-radius: 50%; transform: translateY(-4px); }
        .robot-face-wrapper.angry .eye { transform: scaleY(0.9) skewX(-8deg); border-radius: 45%; }
        .robot-face-wrapper.angry .mouth { width: 40%; height: 12px; border-radius: 5px; transform: rotate(5deg) translateY(10px); background: #ff9999; }
        .robot-face-wrapper.sad .eye { transform: scaleY(0.85) translateY(10px); border-radius: 45%; }
        .robot-face-wrapper.sad .mouth { width: 30%; height: 8px; border-radius: 4px; transform: rotate(-10deg) translateY(20px); background: #88aaff; }
        .robot-face-wrapper.crying .eye { transform: scaleY(0.8) translateY(12px); border-radius: 45%; background: #bbddff; box-shadow: 0 0 30px #88bbff; }
        .robot-face-wrapper.crying .mouth { width: 28%; height: 6px; border-radius: 3px; transform: rotate(-12deg) translateY(24px); background: #88aaff; }
        .robot-face-wrapper.laughing .eye { transform: scale(0.85) translateY(-10px); border-radius: 40% 40% 30% 30%; }
        .robot-face-wrapper.laughing .mouth { width: 70%; height: 35px; border-radius: 0 0 60px 60px; transform: translateY(-6px); background: #ffcc66; }
        .robot-face-wrapper.shy .eye { transform: scale(0.8) translateY(8px); border-radius: 50%; box-shadow: 0 0 20px #ffaaaa; }
        .robot-face-wrapper.shy .mouth { width: 20%; height: 6px; border-radius: 10px; transform: translateY(12px); background: #ffaaaa; }
        .robot-face-wrapper.scared .eye { transform: scale(1.3) translateY(-8px); border-radius: 50% 50% 40% 40%; box-shadow: 0 0 50px #aaccff; }
        .robot-face-wrapper.scared .mouth { width: 35%; height: 28px; border-radius: 50%; transform: translateY(-6px); background: #ddeeff; }
        .ui-overlay {
            width: 100%; max-width: 650px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .input-group { display: flex; gap: 8px; width: 100%; }
        input[type="text"] {
            flex: 1; min-width: 0;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.25); padding: 14px 18px; font-size: 16px;
            color: #fff; border-radius: 50px; outline: none; transition: border 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus { border-color: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.25); }
        input::placeholder { color: rgba(255,255,255,0.4); }
        button {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); color: #fff;
            border: 2px solid rgba(255,255,255,0.3); padding: 14px 22px; font-size: 16px;
            font-weight: 600; border-radius: 50px; cursor: pointer; transition: all 0.3s; white-space: nowrap; flex-shrink: 0;
        }
        button:hover { background: rgba(255,255,255,0.3); border-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.25); transform: scale(1.02); }
        button:active { transform: scale(0.97); }
        .action-buttons { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        #status {
            font-size: 14px; color: rgba(255,255,255,0.65); text-align: center;
            background: rgba(255,255,255,0.04); padding: 8px 18px; border-radius: 40px;
            backdrop-filter: blur(4px); width: 100%; min-height: 38px;
            display: flex; align-items: center; justify-content: center;
        }
        .camera-toggle {
            display: flex; gap: 8px; align-items: center; font-size: 14px;
        }
        @media (max-width: 480px) {
            .robot-face-wrapper { border-radius: 30px; padding: 15px; }
            .camera-circle { width: 60px; height: 60px; top: 6px; right: 8px; }
            .eye { max-width: 75px; }
            .mouth { max-width: 70px; height: 14px; }
            input { font-size: 14px; padding: 12px 14px; }
            button { font-size: 14px; padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="robot-face-wrapper" id="robot-face">
            <div class="camera-circle" id="cameraContainer">

            function findBestMatch(input) {
                const text = input.toLowerCase().trim();
                if (!text) return responseDB["default"];
                if (responseDB[text]) return responseDB[text];
                const keys = Object.keys(responseDB);
                let bestKey = null, bestLen = 0;
                for (let key of keys) {
                    if (key === "default") continue;
                    if (text.includes(key) && key.length > bestLen) {
                        bestLen = key.length;
                        bestKey = key;
                    }
                }
                return bestKey ? responseDB[bestKey] : responseDB["default"];
            }

            const robot = document.getElementById('robot-face');
            const leftEye = document.getElementById('left-eye');
            const rightEye = document.getElementById('right-eye');
            const status = document.getElementById('status');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const micBtn = document.getElementById('mic-btn');

            let blinkInterval = null;
            function startBlinking() {
                if (blinkInterval) clearInterval(blinkInterval);
                blinkInterval = setInterval(() => {
                    if (robot.classList.contains('speaking') || robot.classList.contains('thinking')) return;
                    leftEye.classList.add('closed');
                    rightEye.classList.add('closed');
                    setTimeout(() => {
                        leftEye.classList.remove('closed');
                        rightEye.classList.remove('closed');
                    }, 200);
                }, 6000);
            }
            startBlinking();

            document.getElementById('emo-happy').addEventListener('click', () => setRobotState('happy'));
            document.getElementById('emo-angry').addEventListener('click', () => setRobotState('angry'));
            document.getElementById('emo-sad').addEventListener('click', () => setRobotState('sad'));
            document.getElementById('emo-surprised').addEventListener('click', () => setRobotState('surprised'));
            document.getElementById('reset-emo').addEventListener('click', () => setRobotState('normal'));

            function setRobotState(state) {
                robot.className = 'robot-face-wrapper';
                if (state !== 'normal') robot.classList.add(state);
            }

            function processMessage(text) {
                if (!text.trim()) return;
                status.innerText = `Siz: "${text}"`;
                setRobotState('thinking');
                const result = findBestMatch(text);
                const reply = result.reply;
                const emotion = result.emotion;
                setTimeout(() => {
                    setRobotState(emotion);
                    setTimeout(() => {
                        speakReply(reply, emotion);
                    }, 300);
                }, 400);
            }

            function speakReply(text, emotion) {
                if (!text) return;
                status.innerText = `AI: "${text}"`;
                setRobotState('speaking');
                // Avvalgi ovozni to'xtatamiz
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                // Tilni o'zbekcha qilamiz (ba'zi brauzerlarda ovoz chiqmasa "uz-UZ" ishlatiladi)
                utter.lang = 'uz-UZ';
                utter.rate = 1.0;
                utter.onend = () => {
                    setRobotState(emotion);
                    status.innerText = 'Yana yozishingiz mumkin ✨';
                };
                utter.onerror = (e) => {
                    console.error('SpeechSynthesis xatosi:', e);
                    setRobotState('normal');
                    status.innerText = 'Ovoz chiqarishda xatolik (brauzer ovozni qo‘llab-quvvatlamaydi)';
                };
                window.speechSynthesis.speak(utter);
            }

            sendBtn.addEventListener('click', () => {
                const val = userInput.value.trim();
                if (val) { processMessage(val); userInput.value = ''; }
            });
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendBtn.click();
            });

            // Ovozli kirish
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognizer = new SpeechRecognition();
                recognizer.lang = 'uz-UZ';
                recognizer.continuous = false;
                recognizer.interimResults = false;
                micBtn.addEventListener('click', () => {
                    try {
                        recognizer.start();
                        setRobotState('listening');
                        status.innerText = 'Eshitish...';
                    } catch (e) {
                        status.innerText = 'Mikrofon xatosi';
                    }
                });
                recognizer.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    if (text.trim()) processMessage(text);
                    else status.innerText = 'Ovoz eshitilmadi.';
                };
                recognizer.onerror = () => {
                    status.innerText = 'Ovoz tanishda xatolik';
                    setRobotState('normal');
                };
            } else {
                micBtn.style.opacity = '0.5';
                micBtn.title = 'Brauzer ovozni tanimaydi';
            }

            // Kamera
            const video = document.getElementById('cameraFeed');
            let stream = null;

            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    status.innerText = 'Kamera yoqildi ✅';
                } catch (err) {
                    status.innerText = 'Kamera yoqilmadi: ' + err.message;
                }
            }

            function stopCamera() {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                    stream = null;
                    status.innerText = 'Kamera o\'chirildi ❌';
                }
            }

            document.getElementById('cameraOnBtn').addEventListener('click', startCamera);
            document.getElementById('cameraOffBtn').addEventListener('click', stopCamera);

            window.addEventListener('beforeunload', () => {
                if (blinkInterval) clearInterval(blinkInterval);
                window.speechSynthesis.cancel();
                stopCamera();
            });
        })();
    </script>
</body>
</html>
